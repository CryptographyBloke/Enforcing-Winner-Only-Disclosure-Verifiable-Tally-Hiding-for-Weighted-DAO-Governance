[package]
name = "cgy-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = [
    ".",
    "crates/crypto",
    "crates/protocol",
    "crates/network",
    "crates/ballot",
    "crates/chain",
    "crates/evidence",
]

[dependencies]
cgy-crypto = { path = "crates/crypto" }
cgy-protocol = { path = "crates/protocol" }
cgy-network = { path = "crates/network" }
cgy-ballot = { path = "crates/ballot" }
cgy-chain = { path = "crates/chain" }
cgy-evidence = { path = "crates/evidence" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
rayon = "1.11.0"

[dev-dependencies]
hex = "0.4.3"
