name: CI

on:
  push:
  pull_request:

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/js_protocol/package-lock.json
            implementation/arbitrum/package-lock.json
            circuits/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - run: npm ci --prefix backend/js_protocol
      - run: cargo build --release --locked --manifest-path backend/cgy_native/Cargo.toml
      - run: cargo test --locked --manifest-path backend/cgy_native/Cargo.toml
      - run: npm --prefix backend/js_protocol test
      - run: npm --prefix backend/js_protocol run test:cross-language
      - run: npm ci --prefix implementation/arbitrum
      - run: npm --prefix implementation/arbitrum run compile
      - run: npm --prefix implementation/arbitrum test -- --grep StrongN8Poll
